[project]
name = "unienv_droid"
version = "0.0.1a2"
requires-python = ">= 3.10"
dependencies = [
    "unienv",
    "transforms3d"
]

[project.optional-dependencies]
dataset = [
    "h5py",
    "pyserde",
]
env = [
    "droid"
]

[project.urls]
Homepage = "https://github.com/UniEnvOrg/DroidAdaptor"
Documentation = "https://github.com/UniEnvOrg/DroidAdaptor"
Repository = "https://github.com/UniEnvOrg/DroidAdaptor"
Issues = "https://github.com/UniEnvOrg/DroidAdaptor/issues"
Changelog = "https://github.com/UniEnvOrg/DroidAdaptor/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["*"]
exclude = ["training*", "tests*", "examples*", "assets*"]