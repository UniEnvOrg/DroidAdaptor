[project]
name = "unienv_droid"
version = "0.0.1a1"
requires-python = ">= 3.10"
dependencies = [
    "unienv",
    "transforms3d"
]

[project.optional-dependencies]
dataset = [
    "h5py",
    "pyserde",
]
env = [
    "droid"
]


[tool.setuptools.packages.find]
include = ["*"]
exclude = ["training*", "tests*", "examples*", "assets*"]